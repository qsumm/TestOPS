# AI 运维监控平台 —— 演示编排（FR-G1）
#
# 拉起内容：SeekDB（数据库）+ 平台（API/前端）+ 2 台模拟主机（Agent 容器）
#
# 用法（**必须带 --env-file .env**：-f 指向子目录时 compose 的项目目录会变成 deploy/，
#   根目录的 .env 不会被自动读取，LLM/密钥等变量会全部为空——D7 实测踩到）：
#   cat > .env <<'EOF'   # 可选：不写也能跑，只是 AI 功能会明确报错
#   LLM_BASE_URL=https://api.minimaxi.com/v1
#   LLM_API_KEY=sk-...
#   LLM_MODEL_MAIN=MiniMax-M3
#   LLM_MODEL_FAST=MiniMax-M2.7-highspeed
#   JWT_SECRET=<随机串> KEY_STORE_SECRET=<随机串>
#   EOF
#   docker compose --env-file .env -f deploy/docker-compose.yaml up -d --build   # 首次构建约 3-6 分钟
#   docker compose --env-file .env -f deploy/docker-compose.yaml exec platform python scripts/seed_demo.py --days 7
#   bash deploy/faults/cpu_spike.sh                                  # 触发故障（见 deploy/faults/README.md）
#
# ⚠ 镜像来源：默认统一走国内可达镜像源（docker.m.daocloud.io 公共代理，D226 验证：
#   直连 Docker Hub 在国内网络拉取失败，镜像源前缀全部可拉）。海外用户可自行去掉
#   `docker.m.daocloud.io/` 前缀改回官方名（oceanbase/seekdb、library/python）。

name: aiops-demo

# D64 运维加固：Docker 默认 json-file 日志**不封顶**（长时间运行会把磁盘写满，
# 服务器实测 40G 盘已用 70%）。统一限额：每容器最多 3 个文件 × 10MB。
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  seekdb:
    logging: *default-logging
    # D235：镜像源可配——默认走 daocloud（国内多数机房可达），但其后端在 Cloudflare，
    # 部分机房/云厂商网络直连不通（真机实测 connection refused）。
    # 出网受限的机器在 .env 里设 SEEKDB_IMAGE 即可换源（见《自建部署加速指引》）。
    image: ${SEEKDB_IMAGE:-docker.m.daocloud.io/oceanbase/seekdb:latest}
    container_name: aiops-seekdb
    # ⚠ 不要传 command：该镜像入口把参数当 **SQL** 执行后退出（实测），
    #   不带参数才是常驻服务；建库由平台侧 scripts/db_init.py 负责（幂等）。
    environment:
      # 实测（2026-10-18）：seekdb 1.4 的 /root/start.sh 读的是 **ROOT_PASSWORD**，
      # OB_ROOT_PASSWORD 并未被该脚本使用。只传 OB_* 时，重建已有数据目录会拿空密码校验
      # → “Authentication failed … Refusing to reset” 无限重启。两个都传，兼容不同镜像版本。
      - ROOT_PASSWORD=${DB_PASSWORD:-}
      - OB_ROOT_PASSWORD=${DB_PASSWORD:-}
    restart: unless-stopped
    # D235：shm_size —— Docker 默认 /dev/shm 只有 64MB，而 OceanBase/SeekDB 启动时
    # 要申请大块共享内存；不显式给足，容器会**启动到一半无声退出**（实测：
    # 日志停在 "server_start 3/14"，容器 Exit=1 反复重启，平台一直等不到库 →
    # 表现为 db_init 失败 + curl Connection reset）。官方要求 --shm-size=2g；
    # 这里给 1g（够用且在 2G 小内存机上不至于把内存吃光）。
    shm_size: "1gb"
    ports:
      - "${DB_HOST_PORT:-2891}:2881"
    volumes:
      # seekdb 的**真实数据目录随镜像版本变化**，历史上踩过两次：
      #   · 老镜像（obshell 版）：--data-dir=/var/lib/seekdb/store  → 挂 /var/lib/seekdb
      #   · 新镜像（seekdb 1.4 observer 版）：--base-dir=/var/lib/oceanbase
      #     （启动日志：`Starting seekdb with command: /usr/bin/observer --base-dir=/var/lib/oceanbase
      #       --data-dir=/var/lib/oceanbase/store`）
      # 只挂其中一个 → 另一个路径落在容器可写层：容器一重建数据全丢，且会出现
      # 「.initialized 标记在容器层、数据在卷里」的不同步 → 新密码校验旧数据 →
      # SeekDB.Password.Incorrect 无限重启（真机实测）。
      # **两个路径都挂同一个卷**：新旧镜像都能把数据写进卷里，升级/重建都不丢。
      - seekdb-data:/var/lib/seekdb
      - seekdb-data:/var/lib/oceanbase
    # 不做 healthcheck：镜像内无 mysql/python 客户端（实测），
    # 改为平台侧 db_init.py 带重试等待（更可靠且不依赖镜像内工具）

  platform:
    logging: *default-logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile.platform
      args:
        # pip 源默认走阿里云镜像（实测：直连 pypi.org 30+ 分钟，阿里云 ~10 分钟；2026-10-21 用户要求固化）。
        # 临时换源：PIP_INDEX_URL=... docker compose ... build，或 --build-arg PIP_INDEX_URL=...
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        # D235：可选增强（scikit-learn → 孤立森林算法）。默认 false——它会额外拉
        # numpy+scipy+sklearn ≈ 90MB，慢源下就是十几分钟（开源用户反馈"构建卡住"的
        # 主因）。不装时孤立森林自动降级 3σ，容量趋势预测不受影响（纯 Python 回归）。
        # 需要时：INSTALL_AI_DEPS=true docker compose ... build platform
        INSTALL_AI_DEPS: ${INSTALL_AI_DEPS:-false}
        # D235：基础镜像可配（同上，见 .env 的 BASE_IMAGE）
        BASE_IMAGE: ${BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
    # D235：预构建镜像模式（不想本地 build 的用户）——把上面 build 段整段注释掉，
    # 改用发布好的镜像，并删掉 build 段（compose 里 build 与 image 同时存在时会本地构建）：
    #   platform:
    #     image: ghcr.io/qsumm/testops-platform:v1.9.0
    #     # ...其余配置照旧
    container_name: aiops-platform
    environment:
      - HTTP_PORT=${PLATFORM_PORT:-8848}
      - DB_HOST=seekdb
      - DB_PORT=2881
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=aiops
      - JWT_SECRET=${JWT_SECRET:-demo-jwt-secret-change-me-in-production-0123456789}
      - KEY_STORE_SECRET=${KEY_STORE_SECRET:-demo-keystore-secret-change-me-in-production-01234}
      - DEMO_ENABLED=true
      # D233 试点：PowerContext 跨会话经验库（独立容器，未部署时留空 = 功能关闭）
      - POWERCONTEXT_BASE_URL=${POWERCONTEXT_BASE_URL:-}
      - POWERCONTEXT_SCOPE_ID=${POWERCONTEXT_SCOPE_ID:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # LLM：留空则 AI 功能明确报错（告警/巡检/采集不受影响）。填了即可用真模型。
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL_MAIN=${LLM_MODEL_MAIN:-}
      - LLM_MODEL_FAST=${LLM_MODEL_FAST:-}
    ports:
      - "${PLATFORM_PORT:-8848}:8848"
    # 探活目标：容器内自带 http 服务（deploy/agent/mock_service.py）+ 证书探活示例
    # 由 Dockerfile.agent 的 CMD 注入 --probes
    restart: unless-stopped
    depends_on:
      - seekdb
    command: >
      sh -c "python scripts/db_init.py &&
             alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8848"

  # 模拟主机 1：CPU 敏感型，用于 cpu_spike / mem_leak 故障注入
  mock-host-1:
    logging: *default-logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
      args:
        # D235：与 platform 同一个基础镜像参数（出网受限时换可达源，见《自建部署加速指引》）
        BASE_IMAGE: ${BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
    container_name: aiops-agent-1
    hostname: mock-web-01          # Agent 用 platform.node() 作为主机名上报
    environment:
      - AIOPS_SERVER=http://platform:8848
      # 固定指纹：容器重建不换身份（否则平台会多出一台"新主机"，D7 实测）
      - AIOPS_FINGERPRINT=demo-mock-web-01
      # 注册令牌（D16 强制）：首次部署流程见 docs/04-交付与运营/快速开始.md §2——
      # 平台「主机管理 → 接入新主机」生成令牌 → 写进 .env 的 AIOPS_INSTALL_TOKEN →
      # `docker compose --env-file .env -f deploy/docker-compose.yaml up -d` 重建本容器
      - AIOPS_INSTALL_TOKEN=${AIOPS_INSTALL_TOKEN_1:-}
    restart: unless-stopped
    depends_on:
      - platform
    expose:
      - "8080"

  # 模拟主机 2：带一个会假死的服务，用于 probe_fail / process_hang
  mock-host-2:
    logging: *default-logging
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
      args:
        BASE_IMAGE: ${BASE_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
    container_name: aiops-agent-2
    hostname: mock-db-01
    environment:
      - AIOPS_SERVER=http://platform:8848
      - AIOPS_FINGERPRINT=demo-mock-db-01
      - AIOPS_INSTALL_TOKEN=${AIOPS_INSTALL_TOKEN_2:-}
    restart: unless-stopped
    depends_on:
      - platform
    expose:
      - "8080"

volumes:
  seekdb-data:
